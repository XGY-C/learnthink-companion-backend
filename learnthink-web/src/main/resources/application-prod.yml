# ── 生产环境配置 ──────────────────────────────────────────────────
# 复制到服务器后，通过 --spring.profiles.active=prod 激活

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:learnthink}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  mail:
    host: smtp.qq.com
    port: 587
    username: 3929483358@qq.com
    password: fsjnnkzoipidceae
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

# ── RAG 服务 ──────────────────────────────────────────────────────
rag:
  service:
    url: http://localhost:19531
    connect-timeout: 45s
    read-timeout: 60s

# ── 阿里云 OSS ────────────────────────────────────────────────────
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    accessKeyId: ${aliyun_oss_id}
    accessKeySecret: ${aliyun_oss_key}
    bucketName: learn-think
  tts:
    appKey: ${aliyun_tts_app_key}
    url: https://nls-gateway-cn-shanghai.aliyuncs.com/rest/v1/tts/async

# ── 讯飞星火 ──────────────────────────────────────────────────────
learnthink:
  spark:
    app-id: ${SPARK_APP_ID}
    api-key: ${SPARK_API_KEY}
    api-secret: ${SPARK_API_SECRET}
    domain: xopqwentti20b
    base-url: https://spark-api.cn-huabei-1.xf-yun.com/v2.1/tti

  # 图片生成
  image-provider: qwen
  qwen-image:
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen-image-2.0
    base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
    prompt-extend: true
    watermark: false

  # AI 模型配置
  providers:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}

  models:
    chat:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.7
      thinking-enabled: false
      max-tokens: 100000
    reasoning:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.3
      thinking-enabled: true
      reasoning-effort: high
      max-tokens: 100000
    generation:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.8
      thinking-enabled: false
      max-tokens: 100000
    html-generation:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.8
      thinking-enabled: true
      reasoning-effort: high
      max-tokens: 100000
    unified:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.7
      thinking-enabled: true
      reasoning-effort: high
      max-tokens: 100000
    smart:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.7
      thinking-enabled: false
      max-tokens: 100000

# ── Tavily 搜索 ──────────────────────────────────────────────────
tavily:
  api-key: ${TAVILY_API_KEY:}
  base-url: https://api.tavily.com

# ── Mineru 文档解析 ───────────────────────────────────────────────
mineru:
  api:
    base-url: ${MINERU_BASE_URL:https://mineru.net}
    token: ${MINERU_TOKEN}

# ── Judge0 代码执行 ───────────────────────────────────────────────
judge0:
  base-url: http://localhost:2358
  authn-token: ${JUDGE0_AUTHN_TOKEN:b462826f8eb6335bfe9bdd4050b2a0fd91907d64793434374fd8b83b00bbfe7d}
  authz-token: ${JUDGE0_AUTHZ_TOKEN:53099b07a54b8fd61d8d1381dcff411635b085876eb391f41604f6453e65b7ed}

# ── Manim 视频 ───────────────────────────────────────────────────
manim:
  video:
    api:
      base-url: http://127.0.0.1:8005
      connect-timeout: 60s
      read-timeout: 1200s
