# ── AI Providers & Models ───────────────────────────────────────
# Each provider is an OpenAI-compatible API endpoint.
# Each model preset bundles a provider + model + temperature + optional thinking mode.
#
# Preset usage by agent:
#   chat       → ChatServiceImpl / ConversationAgent (low latency, no thinking)
#   reasoning  → CurriculumPlanner / ContentReviewer (deep reasoning, thinking enabled)
#   generation → DocumentGenerator / ExerciseGenerator / MindmapGenerator / etc.
#
# Thinking mode (DeepSeek CoT):
#   When thinking-enabled=true, the API returns reasoning_content before content.
#   Temperature is ignored by the API in thinking mode.
#   reasoning-effort: "high" (default) or "max" (for complex agentic tasks).
learnthink:
  # 精准资源推送配置
  push:
    enabled: true
    cooldown-minutes: 120           # 两次事件驱动推送的最小间隔（分钟）
    recommendation-limit: 5         # 候选池最大数量
    scoring:                        # 评分参数（可动态调参）
      path-match-bonus-next: 0.3        # 路径匹配-下一模块加分
      path-match-bonus-current: 0.2     # 路径匹配-当前模块加分
      weakness-match-bonus: 0.3         # 薄弱匹配加分
      interest-match-bonus: 0.2         # 兴趣匹配加分
      reason-threshold-path-high: 0.5   # 理由阈值-路径高（触发"即将进入的模块"）
      reason-threshold-path-low: 0.3    # 理由阈值-路径低（触发"当前学习模块"）
      reason-threshold-weakness: 0.3    # 理由阈值-薄弱
      reason-threshold-interest: 0.3    # 理由阈值-兴趣
      candidate-pool-limit: 50          # 候选池最大数量
      weak-tags-recent-days: 7          # 最近薄弱标签查询天数
      bigram-match-threshold: 0.5       # bigram 匹配置信度阈值
      cache-ttl-minutes: 5              # 缓存 TTL（分钟）
      cache-max-size: 500               # 缓存最大条目数
  # Dialogue mode: "standard" (planner→generator, two-phase) or "unified" (thinking+tools, single pass).
  # Standard is the default Plan-then-Generate architecture.
  # Unified uses a single LLM call with thinking mode enabled + tool access + direct reply generation.
  # Switch via ChatSendRequest.dialogueMode or this global default.
  dialogue-mode: standard
  spark:
    app-id: ${SPARK_APP_ID}
    api-key: ${SPARK_API_KEY}
    api-secret: ${SPARK_API_SECRET}
    domain: xopqwentti20b
    base-url: https://spark-api.cn-huabei-1.xf-yun.com/v2.1/tti
  # 图片生成提供者选择：spark（讯飞）或 qwen（千问/DashScope）
  image-provider: qwen
  # 千问 Qwen-Image 文生图配置（DashScope API）
  qwen-image:
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen-image-2.0
    base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
    prompt-extend: true
    watermark: false
  profile:
    session-timeout-minutes: 30
    step1:
      retry-count: 2
      retry-base-ms: 1000
    freeze:
      threshold: 5
      duration-minutes: 60
      backoff-max-hours: 8
    behavior:
      threshold: 2
    cooldown:
      days: 30
      max-cycles: 2
  providers:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
    # openai:
    #   base-url: https://api.openai.com
    #   api-key: ${OPENAI_API_KEY}
    # local:
    #   base-url: http://localhost:11434/v1
    #   api-key: ollama
  models:
    chat:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.7
      thinking-enabled: false
      max-tokens: 100000
    reasoning:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.3
      thinking-enabled: true
      reasoning-effort: high
      max-tokens: 100000
    generation:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.8
      thinking-enabled: false
      max-tokens: 100000
    html-generation:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.8
      thinking-enabled: true
      reasoning-effort: high
      max-tokens: 100000
    unified:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.7
      thinking-enabled: true
      reasoning-effort: high
      max-tokens: 100000
    # Smart 专用预设：Agent ReAct 循环驱动
    # thinking-enabled: false（备选方案 A），temperature 可用
    # 思考链通过 ToolCallObserver 桥接，不依赖 reasoning_content
    smart:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.7
      thinking-enabled: false
      max-tokens: 100000

