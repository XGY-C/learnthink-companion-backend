# 代码执行安全限制
code-execution:
  max-code-length: 50000
  rate-limit-seconds: 30
  rate-limit-count: 15
  blacklist-patterns:
    - "System\\.exit"
    - "os\\.system"
    - "subprocess\\."
    - "Runtime\\.exec"
    - "ProcessBuilder"
    - "eval\\("
    - "exec\\("

# ── Tutoring System Configuration ──────────────────────────────────
tutoring:
  react:
    max-iterations: 10
    # 每轮 ReAct 完整流式输出（Thought + Action + JSON）的阻塞读取上限，单位毫秒
    # 5s 在大模型流式生成下几乎必定超时，调到 120s 比较稳妥
    per-iteration-timeout-ms: 120000
  clarification:
    timeout-seconds: 30
  rag:
    dense-top-k: 20
    sparse-top-k: 20
    rrf-k: 60
    rrf-top-n: 15
    cross-encoder-top-n-core: 5
    cross-encoder-top-n-supplement: 3
    per-query-timeout-ms: 15000
  generator:
    stream-timeout-seconds: 30
    model: deepseek-v4-flash
    temperature: 0.7
    max-tokens: 8192
  diagram:
    max-concurrency: 3
    generate-timeout-seconds: 15
    degradation-enabled: true
  phase2:
    thread-pool-size: 8
  # ── Smart v2 配置 ──
  smart:
    max-interactions: 20              # 最大交互轮数（兜底）
    min-interactions: 3               # 最少交互轮数
    tool-timeout-ms: 30000            # 单工具超时
    llm-timeout-ms: 120000            # LLM 流式超时
    state-ttl-seconds: 7200           # 状态 TTL（2小时）
    max-tool-calls-per-turn: 50       # 每轮最大工具调用次数
    enable-visual-tools: true         # 是否启用可视化工具
    enable-code-execution: true       # 是否启用代码执行
    context-window-messages: 24       # 送入 LLM 的最大消息条数（约 6 轮）
    context-window-rounds: 6          # 完整保留的轮数，更早的用摘要替代
    max-tool-result-chars: 2000       # 工具结果最大字符数，超则截断

